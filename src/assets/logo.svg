<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1A7A4A"/>
      <stop offset="100%" stop-color="#0D5C36"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFD95A"/>
      <stop offset="100%" stop-color="#E6A820"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D5C36" flood-opacity="0.20"/>
    </filter>
    <!-- Clip to icon bounds so gold bars don't bleed out -->
    <clipPath id="iconClip">
      <rect x="0" y="4" width="72" height="72" rx="18"/>
    </clipPath>
  </defs>

  <!-- ── Icon: rounded green square ── -->
  <rect x="0" y="4" width="72" height="72" rx="18" fill="url(#iconGrad)" filter="url(#shadow)"/>

  <!-- ── White R letterform ── -->
  <g clip-path="url(#iconClip)">
    <!-- Left vertical stem -->
    <line x1="20" y1="18" x2="20" y2="62"
          stroke="white" stroke-width="9" stroke-linecap="square"/>
    <!-- Upper bowl -->
    <path d="M20 18 Q52 18 52 31 Q52 44 20 44"
          stroke="white" stroke-width="8" fill="none"
          stroke-linecap="butt" stroke-linejoin="round"/>
    <!-- Diagonal leg -->
    <line x1="22" y1="43" x2="52" y2="62"
          stroke="white" stroke-width="8" stroke-linecap="round"/>

    <!-- ── Two gold vertical strokes through the R (like ₣ / $) ── -->
    <line x1="31" y1="10" x2="31" y2="72"
          stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="41" y1="10" x2="41" y2="72"
          stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- ── Wordmark ── -->
  <text
    x="88" y="53"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="36"
    font-weight="800"
    letter-spacing="-1"
    fill="#0D5C36"
  >bugeti</text>

  <!-- ── Tagline ── -->
  <text
    x="89" y="69"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="11"
    font-weight="400"
    letter-spacing="2.8"
    fill="#5A9E78"
  >MANAGE YOUR MONEY</text>
</svg>
